name: Build Attendance Daily

on:
  schedule:
    - cron: '0 6 * * *' # 12:00 trưa VN (UTC+7)
  workflow_dispatch:

jobs:
  build-attendance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run attendance daily
        run: npm run attendance:daily
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
